name: Link check

on:
  pull_request:
    paths: ['**/*.md', '.github/workflows/links.yml']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  lychee:
    name: Check links in Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lychee
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --no-progress --max-retries 3 --retry-wait-time 5 --timeout 30 \
            --accept '200..=299,403,429' --exclude-path node_modules --exclude-path registry \
            --exclude 'localhost' --exclude '127\.0\.0\.1' --exclude 'example\.(org|com)' \
            './**/*.md'
