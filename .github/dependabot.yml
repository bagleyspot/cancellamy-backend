version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      testing:
        patterns: ['jest', 'ts-jest', '@types/jest', '@nestjs/testing']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'prettier']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Deliberate pins: NestJS 12 is ESM-only and @nestjs/swagger does not support TypeScript 7 yet.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build(deps)'
