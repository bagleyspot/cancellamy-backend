version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      testing:
        patterns: ['jest', 'ts-jest', '@types/jest', '@nestjs/testing']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'prettier']
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades are decided by hand (they often need code changes); known pin: NestJS 12 is ESM-only and
    # @nestjs/swagger lacks TypeScript 7 support.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build(deps)'
    ignore:
      # Stay on the Node.js 22 LTS line; bump it deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
